name: Build Flash Notes APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add native Android code
        run: |
          mkdir -p android/app/src/main/java/com/coconutshell/flashnotes
          cp native/android/com/coconutshell/flashnotes/MainActivity.java android/app/src/main/java/com/coconutshell/flashnotes/MainActivity.java
          cp native/android/com/coconutshell/flashnotes/VaultPlugin.java android/app/src/main/java/com/coconutshell/flashnotes/VaultPlugin.java

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#121212'

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Flash-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flash-Notes
          path: Flash-Notes.apk
          if-no-files-found: error
