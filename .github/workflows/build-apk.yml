                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.coconutshell.takefastnotes.VaultPlugin;"
              )

              text = text.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {\n\n"
                  "    @Override\n"
                  "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "        registerPlugin(VaultPlugin.class);\n"
                  "    }"
              )

          path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check Capacitor configuration
        run: npx cap doctor

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./Take-Fast-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Take-Fast-Notes
          path: Take-Fast-Notes.apk
