<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Take Fast Notes — a fast, minimal, local-first note app.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Take Fast Notes">
  <title>Take Fast Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- HOME: Note browser, search, folders and cards -->
    <section id="homeView" class="view">
      
      <!-- Top Navigation: 3 Xiaomi-style Icons -->
      <header id="homeTopbar" class="topbar-nav">
        <button id="navTabNotes" class="nav-tab active" type="button" aria-label="Notes" data-nav="notes">
          <span class="nav-icon" data-icon="notesTab"></span>
        </button>
        <button id="navTabTasks" class="nav-tab" type="button" aria-label="Tasks" data-nav="tasks">
          <span class="nav-icon" data-icon="tasksTab"></span>
        </button>
        <button id="navTabSettings" class="nav-tab" type="button" aria-label="Settings" data-nav="settings">
          <span class="nav-icon" data-icon="settingsTab"></span>
        </button>
      </header>

      <!-- Selection Mode Header -->
      <header id="selBar" class="topbar sel-topbar" hidden>
        <button id="selClose" class="icon-btn" type="button" aria-label="Cancel selection" data-icon="x"></button>
        <span id="selCount" class="sel-count-label">0 selected</span>
        <div class="sel-actions">
          <button id="selAll" class="icon-btn" type="button" aria-label="Select all" data-icon="check"></button>
          <button id="selPin" class="icon-btn" type="button" aria-label="Pin selected" data-icon="pin"></button>
          <button id="selFav" class="icon-btn" type="button" aria-label="Favorite selected" data-icon="star"></button>
          <button id="selMove" class="icon-btn" type="button" aria-label="Move selected" data-icon="folder"></button>
          <button id="selExport" class="icon-btn" type="button" aria-label="Export selected" data-icon="export"></button>
          <button id="selTrash" class="icon-btn" type="button" aria-label="Move selected to trash" data-icon="trash"></button>
        </div>
      </header>

      <!-- Search Capsule Bar -->
      <div class="search-container">
        <div class="searchbar">
          <span class="s-ic" data-icon="search"></span>
          <input
            id="searchInput"
            type="search"
            inputmode="search"
            placeholder="Search notes"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search notes"
          >
          <button
            id="searchClear"
            class="s-clear"
            type="button"
            aria-label="Clear search"
            data-icon="x"
            hidden
          ></button>
        </div>
      </div>

      <!-- Categories & Folder Navigation Row -->
      <nav id="filterRow" class="category-row" aria-label="Note categories"></nav>

      <!-- Note Cards Content Area -->
      <section id="content" class="content-cards" aria-live="polite"></section>

      <!-- Primary Creation Action: Floating + button -->
      <button id="fab" class="fab" type="button" aria-label="New note" data-icon="plus"></button>
    </section>

    <!-- EDITOR: Title, writing area and toolbar -->
    <section id="editView" class="view" hidden>
      <header class="topbar edit-topbar">
        <button id="backBtn" class="icon-btn" type="button" aria-label="Back to notes" data-icon="back"></button>
        <div id="editTitleBar" class="topbar-title">Untitled</div>
        <span id="saveState" class="save-state">Saved</span>
        <button id="editMenuBtn" class="icon-btn" type="button" aria-label="Note options" data-icon="kebab"></button>
      </header>

      <div id="noteZone">
        <div id="editorScroll" class="editor-scroll bg-white">
          <input
            id="titleInput"
            type="text"
            placeholder="Title"
            autocomplete="off"
            spellcheck="true"
            aria-label="Note title"
          >
          <div
            id="bodyInput"
            contenteditable="true"
            data-placeholder="Start writing…"
            role="textbox"
            aria-multiline="true"
            spellcheck="true"
          ></div>
        </div>

        <div id="fmtbar" class="fmtbar" aria-label="Formatting toolbar">
          <button class="fmt-btn" type="button" data-cmd="bold" data-icon="bold" aria-label="Bold"></button>
          <button class="fmt-btn" type="button" data-cmd="italic" data-icon="italic" aria-label="Italic"></button>
          <button class="fmt-btn" type="button" data-cmd="underline" data-icon="underline" aria-label="Underline"></button>
          <button class="fmt-btn" type="button" data-cmd="heading" data-icon="heading" aria-label="Heading"></button>
          <button class="fmt-btn" type="button" data-cmd="ul" data-icon="ul" aria-label="Bullet list"></button>
          <button class="fmt-btn" type="button" data-cmd="ol" data-icon="ol" aria-label="Numbered list"></button>
          <button class="fmt-btn" type="button" data-cmd="check" data-icon="check" aria-label="Checklist"></button>
          <button class="fmt-btn" type="button" data-cmd="link" data-icon="link" aria-label="Link"></button>
          <button class="fmt-btn" type="button" data-cmd="more" data-icon="moreh" aria-label="More formatting"></button>
        </div>
      </div>
    </section>

    <!-- FOLDER BROWSER PAGE -->
    <section id="folderView" class="view" hidden>
      <header class="topbar">
        <button id="folderBackBtn" class="icon-btn" type="button" aria-label="Back" data-icon="back"></button>
        <h1 class="screen-title">Folders</h1>
      </header>
      
      <section id="folderList" class="content" style="padding-top: 12px;"></section>
      
      <!-- Sticky New Folder Button -->
      <div style="padding: 16px 24px 32px;">
        <button id="newFolderPageBtn" class="setting-choice" type="button" style="justify-content: center;">
          <span class="ric" data-icon="plus" style="color: var(--accent);"></span>
          <span style="color: var(--accent); font-weight: 650; font-size: 16px;">New Folder</span>
        </button>
      </div>
    </section>

    <!-- SETTINGS PAGE -->
    <section id="settingsView" class="view" hidden>
      <header class="topbar">
        <button id="settingsBackBtn" class="icon-btn" type="button" aria-label="Back" data-icon="back"></button>
        <h1 class="screen-title">Settings</h1>
      </header>
      
      <section class="content" style="padding-top: 12px; overflow-y: auto;">
        
        <div class="settings-group">
          <div class="settings-label">Preferences</div>
          <button id="setThemeBtn" class="setting-choice" type="button">
            <span><strong>Theme</strong><small id="themeLabel">Dark</small></span>
          </button>
          <button id="setViewBtn" class="setting-choice" type="button">
            <span><strong>Layout</strong><small id="viewLabel">List View</small></span>
          </button>
          <button id="setSortBtn" class="setting-choice" type="button">
            <span><strong>Sort By</strong><small id="sortLabel">Recently Modified</small></span>
          </button>
        </div>

        <div class="settings-group">
          <div class="settings-label">Defaults</div>
          <button id="setStartBtn" class="setting-choice" type="button">
            <span><strong>Default Launch Screen</strong><small id="startPlaceLabel">Home</small></span>
          </button>
          <button id="setDefFolderBtn" class="setting-choice" type="button">
            <span><strong>Default New-Note Folder</strong><small id="defFolderLabel">Home (Root)</small></span>
          </button>
        </div>

        <div class="settings-group">
          <div class="settings-label">Data & Storage</div>
          <button id="setExportBtn" class="setting-choice" type="button">
            <span><strong>Export Notes</strong><small>Save to device storage</small></span>
            <span data-icon="export" class="mini"></span>
          </button>
          <button id="setImportBtn" class="setting-choice" type="button">
            <span><strong>Import Notes</strong><small>Load Markdown files</small></span>
            <span data-icon="import" class="mini"></span>
          </button>
        </div>
      </section>
    </section>
    
    <!-- OVERLAYS & SHEETS -->
    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <div id="menu" class="menu" hidden role="menu"></div>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetContent" class="sheet-content"></div>
    </div>

    <input
      type="file"
      id="mdImport"
      accept=".md,.json,text/markdown,text/plain,application/json"
      multiple
      hidden
    >

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  </main>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/native-fs.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
