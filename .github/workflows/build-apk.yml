name: Build Take Fast Notes APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Take Fast Notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F7F5F1'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check Capacitor configuration
        run: npx cap doctor

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./Take-Fast-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Take-Fast-Notes
          path: Take-Fast-Notes.apk
