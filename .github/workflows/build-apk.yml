name: Build Take Fast Notes APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#121212'

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Take-Fast-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Take-Fast-Notes
          path: Take-Fast-Notes.apk
          if-no-files-found: error
